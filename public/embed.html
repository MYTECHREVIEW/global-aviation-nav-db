<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AeroNav Live Radar Embed | Multi-Network Tracking</title>
    
    <!-- Google Fonts & Leaflet CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=3.1" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #embedMap {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            background: #060913;
        }

        /* Floating Embed HUD */
        .embed-hud-wrapper {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            max-width: 340px;
            pointer-events: auto;
        }

        /* Embed Mini Controls */
        .embed-controls {
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .embed-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .embed-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #ffffff;
        }

        .embed-btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
        }

        /* Right Slide-over Inspector Card for Embed */
        .fshub-pilot-popup-card {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 360px;
            max-width: calc(100vw - 32px);
            z-index: 1100;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <!-- Full-Screen Interactive Map -->
    <div id="embedMap"></div>

    <!-- Floating Live HUD Card (Top-Left) -->
    <div class="embed-hud-wrapper">
        <div class="live-hud-card" id="liveHudCard" style="display: none; width: 100%;">
            <div class="live-hud-header">
                <div>
                    <span class="live-callsign-badge" id="hudCallsign">--</span>
                    <span style="font-size: 0.72rem; color: #94a3b8; display: block;" id="hudAircraft">--</span>
                </div>
                <span class="live-phase-pill" id="hudPhase">CRUISE</span>
            </div>

            <div class="live-gauge-grid">
                <div class="live-gauge-box">
                    <span class="live-gauge-label">Altitude</span>
                    <span class="live-gauge-val green" id="hudAlt">-- ft</span>
                </div>
                <div class="live-gauge-box">
                    <span class="live-gauge-label">Groundspeed</span>
                    <span class="live-gauge-val cyan" id="hudGs">-- kts</span>
                </div>
                <div class="live-gauge-box">
                    <span class="live-gauge-label">Heading</span>
                    <span class="live-gauge-val amber" id="hudHdg">--°</span>
                </div>
            </div>

            <div class="live-gauge-grid">
                <div class="live-gauge-box">
                    <span class="live-gauge-label">Cross-Track Dev.</span>
                    <span class="live-gauge-val" id="hudXtd">-- NM</span>
                </div>
                <div class="live-gauge-box">
                    <span class="live-gauge-label">Dist. Remaining</span>
                    <span class="live-gauge-val" id="hudRemDist">-- NM</span>
                </div>
                <div class="live-gauge-box">
                    <span class="live-gauge-label">Est. Time Rem.</span>
                    <span class="live-gauge-val" id="hudEte">--</span>
                </div>
            </div>

            <div>
                <div style="display: flex; justify-content: space-between; font-size: 0.72rem; color: #94a3b8;">
                    <span>Route Progress</span>
                    <strong id="hudProgressText" style="color: #00ff88;">0%</strong>
                </div>
                <div class="flight-progress-bar">
                    <div class="flight-progress-fill" id="hudProgressFill" style="width: 0%;"></div>
                </div>
            </div>

            <div style="margin-top: 8px; font-size: 0.74rem; color: #94a3b8; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.08);">
                📍 <strong>Next Fix:</strong> <span id="hudNextWp" style="color: #38bdf8; font-weight: 700;">--</span>
            </div>
        </div>
    </div>

    <!-- Right Slide-Over Pilot Inspector Card -->
    <div id="fshubLivePopup" class="fshub-pilot-popup-card hidden">
        <button class="popup-close-btn" id="closeInspectorBtn" onclick="closeInspectorCard()">✕</button>
        <div id="inspectorContent"></div>
    </div>

    <!-- Embed Bottom Controls -->
    <div class="embed-controls">
        <button class="embed-btn" id="toggleHudBtn" onclick="toggleHud()"><span id="hudIcon">📊</span> HUD</button>
        <button class="embed-btn" onclick="recenterFleet()">🎯 Recenter</button>
        <button class="embed-btn" onclick="toggleLayerStyle()">🗺️ Style</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="embed.js?v=3.1"></script>
</body>
</html>
