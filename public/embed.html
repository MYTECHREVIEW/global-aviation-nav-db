<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AeroNav Live Radar Embed | Multi-Network Tracking</title>
    
    <!-- Google Fonts & Leaflet CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=6.0" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #embedMap {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            background: #060913;
        }
    </style>
</head>
<body>
    <!-- Full-Screen Interactive Map -->
    <div id="embedMap"></div>

    <!-- Floating Pilot Inspector Card (Exact API Design & Glow) -->
    <div id="fshubLivePopup" class="fshub-pilot-floating-card hidden">
        <div id="inspectorContent"></div>
    </div>

    <!-- 📊 Fleet Summary Stats Mini Card (Bottom-Right, Optional via API / &stats=true) -->
    <div id="fleetSummaryStatsCard" class="fleet-summary-stats-card hidden">
        <div class="stats-row">
            <span class="stats-label">PILOTS ONLINE:</span>
            <span class="stats-value" id="statsActivePilots">0</span>
        </div>
        <div class="stats-row">
            <span class="stats-label">PILOTS AIRBORNE:</span>
            <span class="stats-value" id="statsAirbornePilots">0</span>
        </div>
        <div class="stats-row">
            <span class="stats-label">PILOTS ON-GROUND:</span>
            <span class="stats-value" id="statsGroundPilots">0</span>
        </div>
        <div class="stats-row">
            <span class="stats-label">VATSIM ONLINE:</span>
            <span class="stats-value" id="statsVatsimPilots">0</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="embed.js?v=6.0"></script>
</body>
</html>
