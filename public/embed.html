<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AeroNav Live Radar Embed | Multi-Network Tracking</title>
    
    <!-- Google Fonts & Leaflet CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=3.1" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #embedMap {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            background: #060913;
        }

        /* Right Slide-over Inspector Card for Embed */
        .fshub-pilot-popup-card {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 360px;
            max-width: calc(100vw - 32px);
            z-index: 1100;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <!-- Full-Screen Interactive Map -->
    <div id="embedMap"></div>

    <!-- Right Slide-Over Pilot Inspector Card -->
    <div id="fshubLivePopup" class="fshub-pilot-popup-card hidden">
        <div id="inspectorContent"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="embed.js?v=4.0"></script>
</body>
</html>
